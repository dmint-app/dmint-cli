[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmint-cli"
version = "0.1.0"
description = "CLI tooling for Dmint policy creation, compilation, and management"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "dmint>=0.1.0,<0.2.0",
    "dmint-skills>=0.1.0,<0.2.0",
]

[project.scripts]
dmint = "dmint_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
